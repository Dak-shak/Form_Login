<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">

  <form class="bg-white w-full sm:max-w-md p-6 rounded-2xl shadow-lg" onsubmit="loginUser(event)">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Login</h2>

    <input id="loginEmail" type="email" required placeholder="Email" class="mb-4 w-full p-2 border rounded" />
    <div class="relative mb-6">
        <input id="loginPassword" type="password" required placeholder="Password"
               class="w-full p-2 border rounded pr-10" />
        <button type="button" onclick="togglePassword()" class="absolute right-2 top-2 text-sm text-blue-600">Show</button>
      </div>
      

    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>

    <p class="text-center text-sm mt-4">Don't have an account? <a href="reg.html" class="text-blue-600">Register</a></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
